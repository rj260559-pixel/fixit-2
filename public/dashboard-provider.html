<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Provider Dashboard — ServiceConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar" id="navbar"></header>

<section class="section container">
  <h2 class="section-title">Provider Dashboard</h2>

  <div class="card" id="profileSummaryCard" style="margin-bottom:20px;">
    <p class="text-muted">Loading profile…</p>
  </div>

  <div class="dash-grid" id="statsGrid"></div>

  <!-- <div class="tab-bar">
    <button class="tab-btn active" data-tab="requests">Requests</button>
    <button class="tab-btn" data-tab="profile">My Profile & Services</button>
    <button class="tab-btn" data-tab="availability">Availability</button>
  </div> -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="requests">Requests</button>
  <button class="tab-btn" data-tab="profile">My Profile & Services</button>
  <button class="tab-btn" data-tab="availability">Availability</button>
  <button class="tab-btn" data-tab="reviews">Reviews</button>
</div>
  <div id="tab-requests"><p class="text-muted">Loading…</p></div>
  

<div id="tab-reviews" style="display:none;">
  <div class="card">
    <h3>Customer Reviews</h3>

    <div id="providerReviews">
      <p class="text-muted">Loading reviews...</p>
    </div>
  </div>
</div>

<div id="tab-profile" style="display:none;">

  
    <div class="card">
      <h3>Business Profile</h3>
      <form id="profileForm">
        <div class="form-group">
          <label>Business / Display Name</label>
          <input type="text" id="businessName" />
        </div>
        <div class="form-group">
          <label>About</label>
          <textarea id="about" rows="3" placeholder="Tell customers about your experience"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Experience (years)</label>
            <input type="number" id="experienceYears" min="0" />
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Area</label>
            <input type="text" id="area" placeholder="e.g. Sector 18" />
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" />
          </div>
          <div class="form-group">
            <label>Service radius (km)</label>
            <input type="number" id="serviceRadiusKm" min="1" />
          </div>
        </div>
        <button type="button" id="useLocationBtn" class="btn btn-outline">📍 Set my current location</button>
        <p class="text-muted mt-1" id="coordsDisplay" style="font-size:.8rem;"></p>

        <h3 class="mt-3">Services I offer</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="addCategorySelect"></select>
          </div>
          <div class="form-group">
            <label>Sub-service</label>
            <select id="addSubcategorySelect"></select>
          </div>
          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="addPrice" min="0" style="width:100px;" />
          </div>
          <button type="button" class="btn btn-outline" id="addServiceBtn" style="align-self:end;">+ Add</button>
        </div>
        <div class="tags mt-1" id="serviceTagsList"></div>

        <button type="submit" class="btn btn-primary mt-3">Save Profile</button>
        <p class="success-text" id="profileSuccess"></p>
        <p class="error-text" id="profileError"></p>
      </form>
    </div>
  </div>

  <div id="tab-availability" style="display:none;">
    <div class="card">
      <h3>Working Hours</h3>
      <form id="availabilityForm">
        <div class="form-row">
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" id="startTime" />
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" id="endTime" />
          </div>
        </div>
        <div class="form-group">
          <label>Working Days</label>
          <div class="flex" style="gap:10px; flex-wrap:wrap;" id="workingDaysBox"></div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="isAvailableNow" style="width:auto;" /> Available right now</label>
        </div>
        <button type="submit" class="btn btn-primary">Save Availability</button>
        <p class="success-text" id="availSuccess"></p>
      </form>
    </div>
  </div>
</section>

<footer>ServiceConnect — local services marketplace MVP.</footer>

<script src="js/api.js"></script>
<script src="js/dashboard-provider.js"></script>
</body>
</html>
