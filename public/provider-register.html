<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become a Provider — ServiceConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar" id="navbar"></header>

<div class="section container" style="max-width:640px;">
  <h2>Become a Provider</h2>
  <p class="text-muted">Register your business and start receiving service requests from customers near you.</p>

  <div class="card mt-2">
    <form id="providerRegisterForm" novalidate>

      <h3>Account Details</h3>
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="name" required />
        <span class="error-text field-error" id="err-name"></span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" required />
          <span class="error-text field-error" id="err-email"></span>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="phone" placeholder="10-digit mobile number" required />
          <span class="error-text field-error" id="err-phone"></span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="password" required minlength="6" />
          <span class="error-text field-error" id="err-password"></span>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" id="confirmPassword" required minlength="6" />
          <span class="error-text field-error" id="err-confirmPassword"></span>
        </div>
      </div>

      <h3 class="mt-3">Service Details</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Service Category *</label>
          <select id="category" required><option value="">Select category</option></select>
          <span class="error-text field-error" id="err-category"></span>
        </div>
        <div class="form-group">
          <label>Subcategory *</label>
          <select id="subcategory" required><option value="">Select category first</option></select>
          <span class="error-text field-error" id="err-subcategory"></span>
        </div>
      </div>
      <div class="form-group">
        <label>Experience (years)</label>
        <input type="number" id="experience" min="0" placeholder="e.g. 3" />
      </div>
      <div class="form-group">
        <label>Description / About</label>
        <textarea id="description" rows="3" placeholder="Tell customers about your work"></textarea>
      </div>

      <h3 class="mt-3">Location</h3>
      <div class="form-row">
        <div class="form-group">
          <label>City *</label>
          <input type="text" id="city" required />
          <span class="error-text field-error" id="err-city"></span>
        </div>
        <div class="form-group">
          <label>Area</label>
          <input type="text" id="area" placeholder="e.g. Sector 18" />
        </div>
      </div>
      <div class="form-group">
        <label>Pincode *</label>
        <input type="text" id="pincode" maxlength="6" placeholder="6-digit pincode" required />
        <span class="error-text field-error" id="err-pincode"></span>
      </div>

      <h3 class="mt-3">Profile Photo (optional)</h3>
      <div class="form-group">
        <label>Photo URL</label>
        <input type="url" id="profilePhoto" placeholder="https://example.com/photo.jpg" />
        <span class="text-muted" style="font-size:.8rem;">Direct file upload isn't wired up yet — paste an image link for now.</span>
      </div>

      <button type="submit" class="btn btn-accent btn-block mt-3">Create Provider Account</button>
      <p class="error-text" id="formError"></p>
      <p class="success-text" id="formSuccess"></p>
    </form>
    <p class="helper-link">Already registered? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Login</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/provider-register.js"></script>
</body>
</html>
