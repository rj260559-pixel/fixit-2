<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — ServiceConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar" id="navbar"></header>

<div class="auth-wrap">
  <div class="card">
    <h2>Welcome back</h2>
    <p class="text-muted">Login to book services or manage your provider account.</p>
    <form id="loginForm" class="mt-2">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      <p class="error-text" id="errorMsg"></p>
    </form>
    <p class="helper-link">New here? <a href="signup.html" style="color:var(--color-primary);font-weight:600;">Create an account</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
