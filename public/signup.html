<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — ServiceConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar" id="navbar"></header>

<div class="auth-wrap">
  <div class="card">
    <h2>Create your account</h2>
    <p class="text-muted">Join as a customer to book services, or as a provider to receive leads.</p>
    <form id="signupForm" class="mt-2">
      <div class="form-group">
        <label>I am a...</label>
        <select id="role" required>
          <option value="customer">Customer — I need services</option>
          <option value="provider">Provider — I offer services</option>
        </select>
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone" required />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      <p class="error-text" id="errorMsg"></p>
    </form>
    <p class="helper-link">Already have an account? <a href="login.html" style="color:var(--color-primary);font-weight:600;">Login</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
